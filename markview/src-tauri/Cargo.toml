[package]
name = "markview"
version = "1.0.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# enabled by `tauri build` for production; disabled by `tauri dev` so the
# devUrl is used. Without this, release builds also try to load devUrl.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in webview inspector. `lib.rs` gates the MARKVIEW_DEVTOOLS hook on this
# feature, so it has to be declared here to exist; build with
# `--features devtools` when you need it. Release bundles stay without it.
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-shell = "2.3.5"
notify = "8.2.0"
tauri-plugin-single-instance = "2"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

